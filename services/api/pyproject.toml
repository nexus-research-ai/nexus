[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-api"
version = "0.1.0"
description = "FastAPI backend services for Nexus"
requires-python = ">=3.12"
dependencies = [
    "nexus-contracts",
    "nexus-enforcement",
    "nexus-discovery",
    "nexus-intelligence",
    "nexus-workspace",
    "nexus-funding",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0"
]
