[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-monorepo"
version = "0.1.0"
description = "Nexus — Federated Scientific Intelligence & Autonomous Grant Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.2.0"
]

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/kernel",
    "packages/enforcement",
    "packages/discovery",
    "packages/intelligence",
    "packages/workspace",
    "packages/funding",
    "services/api"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
